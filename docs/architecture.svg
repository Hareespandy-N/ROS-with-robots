<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
<title id="title">ROS with Robots: original AMR Research Lab architecture</title>
<desc id="desc">Synthetic maps feed an A star planner, two path trackers, and an ideal differential-drive simulator. Original experiment reports and an optional ROS adapter expose results. There is no hardware driver.</desc>
